<svg width="128" height="128" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="224" height="224" rx="40"
        fill="url(#bg)"/>

  <!-- Back image -->
  <g transform="translate(52 58)" opacity="0.75">
    <rect x="0" y="0" width="92" height="92" rx="14"
          fill="white" filter="url(#shadow)"/>

    <!-- mountains -->
    <path d="M12 68 L34 42 L52 60 L68 38 L80 68 Z"
          fill="#60A5FA"/>

    <!-- sun -->
    <circle cx="68" cy="24" r="8" fill="#FBBF24"/>
  </g>

  <!-- Front duplicate image -->
  <g transform="translate(92 92)">
    <rect x="0" y="0" width="92" height="92" rx="14"
          fill="white" filter="url(#shadow)"/>

    <!-- mountains -->
    <path d="M12 68 L34 42 L52 60 L68 38 L80 68 Z"
          fill="#60A5FA"/>

    <!-- sun -->
    <circle cx="68" cy="24" r="8" fill="#FBBF24"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(150 150)">
    <circle cx="0" cy="0" r="28"
            fill="none"
            stroke="white"
            stroke-width="10"/>

    <line x1="20" y1="20" x2="44" y2="44"
          stroke="white"
          stroke-width="10"
          stroke-linecap="round"/>
  </g>

  <!-- Duplicate indicator -->
  <g transform="translate(174 64)">
    <circle cx="0" cy="0" r="30" fill="#EF4444"/>
    <text x="0" y="10"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="30"
          font-weight="bold"
          fill="white">
      =
    </text>
  </g>
</svg>
